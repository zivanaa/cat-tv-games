name: cat_tv_games
description: Games and ambient video for cats, with per-cat stats for their owners.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Versions are deliberately not pinned here. Run the `flutter pub add` commands
# in README.md so the resolver picks versions that match your installed SDK.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
